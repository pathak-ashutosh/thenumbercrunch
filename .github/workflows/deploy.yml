name: Deploy
on:
  push:
    branches: [main]

# Least privilege: this workflow only needs to read the repo. It pushes to the
# VPS over SSH and purges Cloudflare using dedicated secrets, so the GITHUB_TOKEN
# needs no write scopes.
permissions:
  contents: read

# Never let two deploys run at once (rsync --delete on an overlapping run could
# corrupt the live docroot). Queue instead of cancelling so an in-flight deploy
# finishes cleanly.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to a full commit SHA (not a mutable tag)
      # so a compromised/retagged release can't run arbitrary code with access
      # to the SSH deploy key. Update the SHA + comment together when bumping.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: '0.164.0'
          extended: false
      - name: Build
        run: hugo --minify --gc
      - name: Deploy to VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          # Optional: set this secret to the VPS host key (`ssh-keyscan <host>`)
          # to pin it and stop trusting whatever key answers at deploy time.
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "${VPS_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          fi
          chmod 644 ~/.ssh/known_hosts
          rsync -av --delete public/ "deploy@$VPS_HOST:/var/www/thenumbercrunch.com/html/"
      - name: Purge Cloudflare Cache
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          # -f makes a non-2xx response fail the step instead of passing silently.
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
